name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # The design targets 64-bit amd64 and arm64 only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race detector on)
        run: go test -race -count=1 ./...
      - name: fuzz smoke
        run: go test -run '^$' -fuzz FuzzMatch -fuzztime 20s ./internal/edge